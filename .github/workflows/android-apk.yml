name: Android test APK

# Builds an installable debug APK for testing on a phone.
# Download it from the run's "Artifacts" section on the Actions tab.
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the game
        run: |
          npm ci
          npm run build

      - name: Copy the game into the Android app
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cutie-squishies-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
